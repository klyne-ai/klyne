version: "2"

run:
  timeout: 5m
  # Match go.mod's `go` directive. CI runners use GOTOOLCHAIN=auto to
  # download the required toolchain on demand.
  go: "1.25"

linters:
  enable:
    - errcheck      # Check for unchecked errors
    - gosec         # Security checks (OWASP-style)
    - govet         # go vet checks
    - staticcheck   # Comprehensive static analysis
    - unused        # Unused code detection
    - gocyclo       # Cyclomatic complexity
    - goconst       # Repeated string literals that should be constants

  # Nothing disabled — every enabled linter is intentional.
  # Add disable entries only with a justifying comment.

formatters:
  enable:
    - gofumpt       # Stricter gofmt formatting
