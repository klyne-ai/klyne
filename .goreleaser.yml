# GoReleaser configuration for klyne.
#
# Produces cross-platform binaries (darwin/linux/windows × amd64/arm64),
# archives, sha256 checksums, and a GitHub release.
#
# Local testing (no publish): `make release-snapshot` (wraps
# `goreleaser release --snapshot --clean`). Real releases run from
# .github/workflows/release.yml on a `v*.*.*` tag push.
#
# CGO is disabled to match the Makefile: modernc.org/sqlite is pure Go,
# and CGO with the macOS 26 + Go 1.21 internal linker produces binaries
# dyld rejects (see Makefile build target for full rationale).

version: 2

project_name: klyne

env:
  - GOTOOLCHAIN=auto

before:
  hooks:
    - go mod tidy

builds:
  - id: klyne
    main: ./cmd/klyne
    binary: klyne
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      # Windows on arm64 is not in the target matrix.
      - goos: windows
        goarch: arm64

  # klyne-hook is the tiny stub binary Claude Code invokes per
  # PreToolUse / UserPromptSubmit / PreCompact / Stop event. The full
  # klyne binary is ~22 MB and loads ~100 MB resident at launch, which
  # the macOS jetsam killer terminates under memory pressure. Shipping
  # the hook as a small sibling binary keeps every hook invocation fast.
  - id: klyne-hook
    main: ./cmd/klyne-hook
    binary: klyne-hook
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: klyne
    ids:
      - klyne
      - klyne-hook
    # Asset filename pattern. MUST stay in sync with scripts/install.sh,
    # which constructs the same string to fetch the archive.
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# Sign the checksum manifest with keyless Sigstore in GitHub Actions. The
# manifest covers every platform archive, so users can verify one signature
# and then verify the exact archive they downloaded.
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - "sign-blob"
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "Merge pull request"
      - "Merge branch"

release:
  github:
    owner: klyne-ai
    name: klyne
  draft: false
  prerelease: auto
  name_template: "klyne {{ .Tag }}"
