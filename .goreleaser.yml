# GoReleaser configuration for klyne.
#
# Produces cross-platform binaries (darwin/linux/windows × amd64/arm64),
# archives, sha256 checksums, a GitHub release, and a Homebrew tap cask.
#
# Local testing (no publish): `make release-snapshot` (wraps
# `goreleaser release --snapshot --clean`). Real releases run from
# .github/workflows/release.yml on a `v*.*.*` tag push.
#
# CGO is disabled to match the Makefile: modernc.org/sqlite is pure Go,
# and CGO with the macOS 26 + Go 1.21 internal linker produces binaries
# dyld rejects (see Makefile build target for full rationale).
#
# Manual prerequisites BEFORE a real release tag is pushed:
#   1. Create the empty repo `klyne-ai/homebrew-tap` on GitHub.
#   2. Create a fine-scoped PAT with `contents:write` on that tap repo
#      and add it to this repo's secrets as `HOMEBREW_TAP_GITHUB_TOKEN`.
#      Without that secret, the homebrew step will fail and the rest of
#      the release will still publish.

version: 2

project_name: klyne

env:
  - GOTOOLCHAIN=auto

before:
  hooks:
    - go mod tidy

builds:
  - id: klyne
    main: ./cmd/klyne
    binary: klyne
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      # Windows on arm64 is not in the target matrix.
      - goos: windows
        goarch: arm64

  # klyne-hook is the tiny stub binary Claude Code invokes per
  # PreToolUse / UserPromptSubmit / PreCompact / Stop event. The full
  # klyne binary is ~22 MB and loads ~100 MB resident at launch, which
  # the macOS jetsam killer terminates under memory pressure. Shipping
  # the hook as a small sibling binary keeps every hook invocation fast.
  - id: klyne-hook
    main: ./cmd/klyne-hook
    binary: klyne-hook
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: klyne
    ids:
      - klyne
      - klyne-hook
    # Asset filename pattern. MUST stay in sync with scripts/install.sh,
    # which constructs the same string to fetch the archive.
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# Sign the checksum manifest with keyless Sigstore in GitHub Actions. The
# manifest covers every platform archive, so users can verify one signature
# and then verify the exact archive they downloaded.
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - "sign-blob"
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "Merge pull request"
      - "Merge branch"

release:
  github:
    owner: klyne-ai
    name: klyne
  draft: false
  prerelease: auto
  name_template: "klyne {{ .Tag }}"

# Homebrew tap publishing. GoReleaser deprecated the old `brews` pipe in
# v2.16; casks are now the supported way to distribute pre-built binaries.
# Skipped automatically for `--snapshot` runs.
homebrew_casks:
  - name: klyne
    ids:
      - klyne
    binaries:
      - klyne
      - klyne-hook
    repository:
      owner: klyne-ai
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: klyne-release-bot
      email: release@klyne.ai
    commit_msg_template: "chore(brew): klyne {{ .Tag }}"
    homepage: "https://github.com/klyne-ai/klyne"
    description: "Local-first worklog for developers using AI."
    skip_upload: auto
