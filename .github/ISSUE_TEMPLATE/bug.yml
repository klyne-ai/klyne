name: Bug Report
description: Report a bug or unexpected behavior in agentdeck.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much detail as you can.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
      placeholder: "When I do X, Y happens instead of Z."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Exact steps to reproduce the behavior.
      placeholder: |
        1. Run `agentdeck start`
        2. Open the browser at localhost:7878
        3. Click on ...
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened? Include error messages, logs, or screenshots.
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: agentdeck doctor output
      description: Run `agentdeck doctor` and paste the full output here.
      render: text
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating System
      description: "e.g. macOS 15.4, Ubuntu 24.04, Windows 11"
    validations:
      required: true

  - type: dropdown
    id: cli
    attributes:
      label: CLI(s) Affected
      description: Which AI coding CLI is involved in this bug?
      options:
        - Claude Code
        - Codex CLI
        - Both
        - Neither / agentdeck itself
    validations:
      required: true
