name: Feature Request
description: Propose a new feature or enhancement for agentdeck.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature. Please describe it clearly so we can evaluate it against the v1 scope and roadmap.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this feature solve? Describe the user pain concretely.
      placeholder: "As a user, I often find myself unable to X because..."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the feature you would like to see. Be as specific as possible.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What alternatives have you considered or tried? Why are they insufficient?
    validations:
      required: false
