# CI workflow.
#
# Runs on the current default branch (`init`) and remains ready for the
# planned rename to `main`.
# Provides the test/lint signal that's missing from a public OSS-Go-CLI
# repo by default — release.yml handles tagging only.
#
# Jobs:
#   - go    — go vet + go test -race + golangci-lint on Ubuntu 24.04
#   - ui    — svelte-check + vitest + production build on Ubuntu 24.04
#   - drift — contract-drift guard: run go dump-contracts then compare to
#             the UI's typed expectations (scripts/check-contracts.ts).
#
# Concurrency: keyed on workflow + ref so a fast follow-up push cancels
# in-flight runs on the same branch. The release workflow uses its own
# concurrency key so this never cancels a release.

name: ci

on:
  push:
    branches: [init, main]
  pull_request:
    branches: [init, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: go test + vet + lint
    runs-on: ubuntu-24.04
    env:
      # Pin the compiler and standard library to the same patch release.
      # Mixing setup-go's go directive (1.25.0) with go.mod's toolchain
      # directive (1.25.3) can poison the shared build cache.
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
        with:
          # golangci-lint compares against the PR base (or previous pushed
          # commit), so both revisions must be available locally.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.3"
          cache: true
      - name: configure test git identity
        # Productivity integration tests filter commits to the configured
        # user identity. Fresh GitHub runners do not have one by default.
        run: |
          git config --global user.name "Klyne CI"
          git config --global user.email "dev@example.com"
      # The embed.FS at module root needs ui/build/ to exist before any
      # Go compile step. Create an empty stub so go vet/test compile.
      # Real builds (release.yml) replace this with the actual UI bundle.
      - name: stub ui/build for embed
        run: mkdir -p ui/build && echo '<!doctype html>' > ui/build/index.html
      - name: go vet
        run: go vet ./...
      - name: store performance proxy
        # Keep the wall-clock budget meaningful by running it without the
        # race detector. The full race suite below still exercises the same
        # code path, but treats its heavily instrumented timing as diagnostic.
        run: go test ./internal/store -run '^TestBulkInsert_5K_PerformanceProxy$' -count=1
      - name: go test -race
        # -coverprofile emits a profile so reviewers can pinpoint which
        # branches a PR did/didn't cover. -covermode=atomic is required
        # whenever -race is on. ./... covers every package; the resulting
        # file is uploaded as a job artifact below for inspection in the
        # PR's Actions tab.
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -20
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: go-coverage
          path: coverage.out
          retention-days: 14
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          # The repository has a pre-existing lint backlog. Gate only issues
          # introduced by this change until that backlog is cleaned up.
          args: --new-from-rev=${{ github.event.pull_request.base.sha || github.event.before }}
      - name: installer smoke test
        run: sh scripts/install-test.sh

  ui:
    name: ui check + test + build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: npm ci
        run: npm ci
      - name: svelte-kit sync
        # svelte-check extends .svelte-kit/tsconfig.json, which is generated
        # locally by the dev/build commands but does not exist after checkout.
        run: npx svelte-kit sync
      - name: svelte-check
        run: npx svelte-check --tsconfig ./tsconfig.json
      - name: vitest
        run: npm test
      - name: production build
        run: npm run build

  drift:
    name: contract drift
    needs: [go, ui]
    runs-on: ubuntu-24.04
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.3"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: install ui deps
        working-directory: ui
        run: npm ci
      - name: dump go contracts
        run: CGO_ENABLED=0 go run ./tools/dump-contracts > /tmp/contract-dump.json
      - name: compare to ui expectations
        working-directory: ui
        run: npx tsx scripts/check-contracts.ts
