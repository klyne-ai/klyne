name: Performance Benchmarks

# Spec §12: nightly benchmark run + on-demand via workflow_dispatch.
# Uploads bench-output.json as an artifact for trend tracking.
on:
  schedule:
    # Run at 04:00 UTC every night.
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      bench_time:
        description: "go test -benchtime value (e.g. 5s, 10s)"
        required: false
        default: "5s"

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    name: Spec §12 Performance Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Build binary
        run: GOTOOLCHAIN=local CGO_ENABLED=0 make build

      - name: Run performance benchmarks
        env:
          BENCH_TIME: ${{ github.event.inputs.bench_time || '5s' }}
          NO_BUILD: "1"   # already built above
        run: bash scripts/bench-ci.sh

      - name: Upload bench report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-output-${{ github.run_id }}
          path: bench-output.json
          retention-days: 90

      - name: Print bench report summary
        if: always()
        run: |
          if [ -f bench-output.json ]; then
            echo "### Spec §12 Performance Report" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| Metric | Value | Budget | Status |" >> "$GITHUB_STEP_SUMMARY"
            echo "|--------|-------|--------|--------|" >> "$GITHUB_STEP_SUMMARY"
            jq -r 'to_entries[] |
              "| \(.key) | \(.value.value) \(.value.unit) | \(.value.budget) \(.value.unit) | \(if .value.ok then "✅ PASS" else "❌ FAIL" end) |"' \
              bench-output.json >> "$GITHUB_STEP_SUMMARY"
          fi
